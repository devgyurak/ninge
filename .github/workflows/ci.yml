name: ci

# Runs ./scripts/verify.sh — the same gate an agent or a contributor runs locally. Until
# Phase 0 adds Cargo.toml, the Rust steps are skipped and only the Python gates run.
#
# The tests are most of a run, so each OS splits them over shards: the `test` jobs each run
# the whole gate with one part of the tests (NINGE_TEST_SHARD) and upload that part's
# coverage, which verify.sh measures over the unit tests only. No shard can meet the coverage floor alone, so the `verify` job of each OS merges
# its shards' coverage and checks the floor (NINGE_COVERAGE_SHARDS). The branch rulesets
# require the `verify` checks by name, and those fail unless every shard passed.
#
# A documentation-only change (scripts/docs_only.py decides) builds no test ROMs and installs
# no Rust tools: verify.sh runs its Python gates and skips the cargo steps, in one shard. The
# verify jobs still run, because a workflow that does not start, or a matrix job skipped as a
# whole, never reports the required checks.
#
# When it runs: for every pull request into develop or main, and for a push to main (a
# release). A merge into develop does not run it again: the pull request already ran this gate
# on its merge with develop, and the release pull request runs it on develop as a whole. The
# one exception is cache.yml, which calls this workflow for a push to develop that changes
# the dependencies, because only a run on develop may save the caches pull requests restore.

on:
  push:
    branches: [main]
  pull_request:
    branches: [develop, main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether the change is documentation only, and the commit it was compared with. A pull
  # request is checked out as its merge commit, whose first parent is the base branch, so the
  # comparison is the whole pull request and not its last commit; a push is compared with the
  # commit the branch pointed at before. The step cannot fail: anything docs_only.py is not
  # sure of is a full run.
  #
  # It also says how many shards each OS splits its tests over. SHARDS below is the one place
  # that number lives. A documentation-only change runs no tests and gets a single shard.
  scope:
    name: scope
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      base: ${{ steps.scope.outputs.base }}
      shard_count: ${{ steps.scope.outputs.shard_count }}
      shards: ${{ steps.scope.outputs.shards }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Change scope
        id: scope
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
          # macOS runs at most five jobs at once on this plan, across every run in progress.
          # Two is enough since the integration tests stopped being instrumented: a shard's
          # tests take well under a minute, and the rest of a job (setup, lint, the two builds)
          # is spent once per shard whatever the count.
          SHARDS: 2
        run: |
          DOCS_ONLY=false
          if python3 scripts/docs_only.py "$BASE"; then
            DOCS_ONLY=true
            SHARDS=1
          fi
          {
            echo "docs_only=$DOCS_ONLY"
            echo "base=$BASE"
            echo "shard_count=$SHARDS"
            echo "shards=[$(seq 1 "$SHARDS" | paste -sd, -)]"
          } >> "$GITHUB_OUTPUT"

  # Builds the test ROMs once, on ubuntu where Docker runs, with the BlocksDS image pinned by
  # digest inside scripts/build_testroms.sh (the only place the digest lives). macOS runners
  # cannot run Docker, so the test jobs download this artifact instead. Decided in #65.
  testroms:
    name: testroms
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build test ROMs
        run: ./scripts/build_testroms.sh

      # Printed so a reviewer can read the ROM hash from the log.
      - name: ROM checksums
        run: cat testroms/build/SHA256SUMS

      - name: Upload test ROMs (with SHA256SUMS)
        uses: actions/upload-artifact@v4
        with:
          name: testroms
          path: |
            testroms/build/*.nds
            testroms/build/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  # One shard of one OS: the whole gate, with one part of the tests.
  test:
    name: test (${{ matrix.os }}, ${{ matrix.shard }}/${{ needs.scope.outputs.shard_count }})
    needs: [scope, testroms]
    # testroms is skipped for a documentation-only change and the shard must run all the same.
    # Without a status function a job is skipped when a job it needs was, so the condition is
    # spelled out: scope succeeded, and testroms succeeded or was skipped. A failed scope or
    # testroms still skips the shards, and the verify jobs below then fail.
    if: ${{ !cancelled() && needs.scope.result == 'success' && (needs.testroms.result == 'success' || needs.testroms.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    env:
      DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is included on purpose: Apple Silicon is the target machine (plan §5, Phase 8).
        os: [ubuntu-latest, macos-latest]
        shard: ${{ fromJSON(needs.scope.outputs.shards) }}
    steps:
      # verify.sh compares with the same commit as the scope job, so a documentation-only run
      # needs the history; a full run does not. The depths are strings because a bare 0 is
      # false in an expression and `&& 0 || 1` would always give 1.
      - uses: actions/checkout@v5
        with:
          fetch-depth: ${{ needs.scope.outputs.docs_only == 'true' && '0' || '1' }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # gilrs (gamepads, the frontend) links libudev on Linux.
      - name: libudev (Linux)
        if: env.DOCS_ONLY != 'true' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      # rustup installs the exact version and components pinned in rust-toolchain.toml
      # (AGENTS.md §4) — never a floating `stable`.
      - name: Rust toolchain (pinned)
        if: env.DOCS_ONLY != 'true' && hashFiles('Cargo.toml') != ''
        run: rustup toolchain install

      - name: cargo-nextest · cargo-llvm-cov · cargo-deny
        if: env.DOCS_ONLY != 'true' && hashFiles('Cargo.toml') != ''
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov,cargo-deny

      # Without a cache every run downloads the crates and builds the dependencies, at
      # opt-level 1, three times (clippy, the coverage build of the unit tests, the ordinary
      # build of the integration tests, which the doc tests share): about a minute and a
      # half per job. The cache holds ~/.cargo and target/; our own crates are always rebuilt.
      # It is keyed by Cargo.lock and the toolchain, and only develop saves it, so pull requests
      # restore develop's cache without filling the repository's cache quota with their own.
      # A run on develop is the one cache.yml starts when the dependencies change.
      # Every shard builds the same things, so they share one cache and the first shard saves
      # it. The key keeps the name it had when this job was called verify, so the caches
      # develop already holds still match.
      - name: Cache cargo dependencies
        if: env.DOCS_ONLY != 'true' && hashFiles('Cargo.toml') != ''
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify
          save-if: ${{ github.ref == 'refs/heads/develop' && matrix.shard == 1 }}

      # Built test ROMs are never committed (AGENTS.md §3.1); the testroms job builds them.
      # macOS cannot run Docker: it verifies the artifact in place. Ubuntu keeps the artifact
      # outside testroms/build/ so verify.sh rebuilds from source and compares the two.
      - name: Download test ROMs (macOS, verified in place)
        if: env.DOCS_ONLY != 'true' && runner.os == 'macOS'
        uses: actions/download-artifact@v4
        with:
          name: testroms
          path: testroms/build/

      - name: Download test ROMs (Linux, compared with the rebuild)
        if: env.DOCS_ONLY != 'true' && runner.os != 'macOS'
        uses: actions/download-artifact@v4
        with:
          name: testroms
          path: ${{ runner.temp }}/testroms

      # The ARM7TDMI JSON suite (about 900 MB) is fetched by verify.sh. The cache is keyed by
      # the tracked checksums, so it is reused until the pinned suite changes.
      - name: Cache CPU test suite
        if: env.DOCS_ONLY != 'true'
        uses: actions/cache@v4
        with:
          path: tests/data/arm7tdmi
          key: cpu-suite-${{ hashFiles('tests/cpu_suite/SHA256SUMS') }}

      # Decided in #65. Ubuntu has Docker: it rebuilds the ROMs and must match the artifact.
      # macOS only verifies the artifact's checksums. The prebuilt variable is set for macOS
      # alone, so a runner without Docker cannot silently skip the build. A documentation-only
      # run hands verify.sh the commit to compare with; verify.sh checks the change again itself.
      - name: Verify (one shard of the tests)
        env:
          NINGE_DOCS_ONLY_BASE: ${{ needs.scope.outputs.docs_only == 'true' && needs.scope.outputs.base || '' }}
          NINGE_PREBUILT_TESTROMS: ${{ runner.os == 'macOS' && '1' || '' }}
          NINGE_EXPECTED_TESTROM_SUMS: ${{ runner.os != 'macOS' && format('{0}/testroms/SHA256SUMS', runner.temp) || '' }}
          NINGE_TEST_SHARD: ${{ matrix.shard }}/${{ needs.scope.outputs.shard_count }}
        run: ./scripts/verify.sh

      # The verify job of this OS merges the shards' reports. A shard that failed uploads
      # nothing, and the merge refuses an incomplete set. One day is the shortest retention.
      - name: Upload this shard's coverage
        if: env.DOCS_ONLY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.shard }}
          path: target/coverage/*.lcov
          if-no-files-found: error
          retention-days: 1

  # The required checks. Each one stands for an OS: it fails unless every shard passed, then
  # merges that OS's coverage and checks the floor. The merge is a small script, so both run on
  # ubuntu and no macOS runner is spent on it. `!cancelled()` makes the job run, and so fail,
  # when the shards failed or were skipped; a job skipped as a whole would report no check.
  verify:
    name: verify (${{ matrix.os }})
    needs: [scope, test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
    strategy:
      fail-fast: false
      matrix:
        # The OS whose shards this job answers for, not the runner it uses.
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Every shard passed
        if: needs.test.result != 'success'
        run: |
          echo "The test shards did not all pass (result: ${{ needs.test.result }}) — see the test jobs." >&2
          exit 1

      - uses: actions/checkout@v5
        if: env.DOCS_ONLY != 'true'

      - name: Download the shards' coverage
        if: env.DOCS_ONLY != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-${{ matrix.os }}-*
          path: ${{ runner.temp }}/coverage
          merge-multiple: true

      # A documentation-only change ran no tests, so there is no coverage to check.
      - name: Coverage floor over the merged shards
        if: env.DOCS_ONLY != 'true'
        env:
          NINGE_COVERAGE_SHARDS: ${{ runner.temp }}/coverage
        run: ./scripts/verify.sh
