name: ci

# Runs ./scripts/verify.sh — the same gate an agent or a contributor runs locally. Until
# Phase 0 adds Cargo.toml, the Rust steps are skipped and only the Python gates run.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds the test ROMs once, on ubuntu where Docker runs, with the BlocksDS image pinned by
  # digest inside scripts/build_testroms.sh (the only place the digest lives). macOS runners
  # cannot run Docker, so the verify jobs download this artifact instead. Decided in #65.
  testroms:
    name: testroms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build test ROMs
        run: ./scripts/build_testroms.sh

      # Printed so a reviewer can read the ROM hash from the log.
      - name: ROM checksums
        run: cat testroms/build/SHA256SUMS

      - name: Upload test ROMs (with SHA256SUMS)
        uses: actions/upload-artifact@v4
        with:
          name: testroms
          path: |
            testroms/build/*.nds
            testroms/build/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  verify:
    name: verify (${{ matrix.os }})
    needs: testroms
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is included on purpose: Apple Silicon is the target machine (plan §5, Phase 8).
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # rustup installs the exact version and components pinned in rust-toolchain.toml
      # (AGENTS.md §4) — never a floating `stable`.
      - name: Rust toolchain (pinned)
        if: hashFiles('Cargo.toml') != ''
        run: rustup toolchain install

      - name: cargo-nextest · cargo-llvm-cov · cargo-deny
        if: hashFiles('Cargo.toml') != ''
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov,cargo-deny

      # Without a cache every run downloads the crates and builds the dependencies, at
      # opt-level 1, three times (clippy, the coverage build, doc tests): about a minute and a
      # half per job. The cache holds ~/.cargo and target/; our own crates are always rebuilt.
      # It is keyed by Cargo.lock and the toolchain, and only develop saves it, so pull requests
      # restore develop's cache without filling the repository's cache quota with their own.
      - name: Cache cargo dependencies
        if: hashFiles('Cargo.toml') != ''
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      # Built test ROMs are never committed (AGENTS.md §3.1); the testroms job builds them.
      # macOS cannot run Docker: it verifies the artifact in place. Ubuntu keeps the artifact
      # outside testroms/build/ so verify.sh rebuilds from source and compares the two.
      - name: Download test ROMs (macOS, verified in place)
        if: runner.os == 'macOS'
        uses: actions/download-artifact@v4
        with:
          name: testroms
          path: testroms/build/

      - name: Download test ROMs (Linux, compared with the rebuild)
        if: runner.os != 'macOS'
        uses: actions/download-artifact@v4
        with:
          name: testroms
          path: ${{ runner.temp }}/testroms

      # The ARM7TDMI JSON suite (about 900 MB) is fetched by verify.sh. The cache is keyed by
      # the tracked checksums, so it is reused until the pinned suite changes.
      - name: Cache CPU test suite
        uses: actions/cache@v4
        with:
          path: tests/data/arm7tdmi
          key: cpu-suite-${{ hashFiles('tests/cpu_suite/SHA256SUMS') }}

      # Decided in #65. Ubuntu has Docker: it rebuilds the ROMs and must match the artifact.
      # macOS only verifies the artifact's checksums. The prebuilt variable is set for macOS
      # alone, so a runner without Docker cannot silently skip the build.
      - name: Verify
        env:
          NINGE_PREBUILT_TESTROMS: ${{ runner.os == 'macOS' && '1' || '' }}
          NINGE_EXPECTED_TESTROM_SUMS: ${{ runner.os != 'macOS' && format('{0}/testroms/SHA256SUMS', runner.temp) || '' }}
        run: ./scripts/verify.sh
