[workspace]
resolver = "3"
members = ["crates/core", "crates/runner", "crates/frontend", "crates/tracediff"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
# Publishable since 0.1.0 (AGENTS.md §7). ninge-runner and ninge-tracediff say `publish = false`
# themselves and stay unpublished; the release workflow checks that only ninge-core and ninge
# are publishable. The next release bumps `version` here and the `ninge-core` entry below, and
# refreshes `Cargo.lock` (`cargo update -w`).
publish = true
repository = "https://github.com/devgyurak/ninge"

[workspace.dependencies]
ninge-core = { path = "crates/core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
# A module with children is `dir/mod.rs`, never `dir.rs` beside `dir/` (AGENTS.md §4).
self_named_module_files = "deny"

# The emulator is too slow to test unoptimized: a test ROM run of 10 frames took 6.4 s at
# opt-level 0 and 0.26 s at 1, and the CI test step took 9-12 minutes. opt-level 1 keeps
# debug-assertions and overflow-checks, so a guest value that should wrap still panics a test
# (AGENTS.md §4), and line coverage measured the same (94.44%) at both. `cargo test`, `cargo llvm-cov`
# and `cargo run` all build with this profile.
[profile.dev]
opt-level = 1
