name: agents

# Guards the agent configuration itself: broken pointers, subagent body drift, or a hook
# whose script went missing fail here (and in the PR) instead of on a contributor's machine.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  # retarget.yml starts it for a pull request whose base changed to develop or main, with the
  # pull request's merge commit; see ci.yml for why that is not an `edited` trigger here.
  workflow_dispatch:
    inputs:
      pull_request:
        description: The pull request whose base changed (retarget.yml)
        required: true
        type: string
      merge_sha:
        description: Its merge commit with the new base
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: agents-${{ inputs.pull_request && format('refs/pull/{0}/merge', inputs.pull_request) || github.ref }}
  cancel-in-progress: true

jobs:
  config:
    name: agent-config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.merge_sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check agent config
        run: python3 scripts/check_agent_config.py

      - name: Hook selftest
        run: python3 scripts/agent_hooks/selftest.py
