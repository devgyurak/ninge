[workspace]
resolver = "3"
members = ["crates/core", "crates/runner", "crates/frontend", "crates/tracediff"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/devgyurak/ninge"

[workspace.dependencies]
ninge-core = { path = "crates/core", version = "0.0.0" }
serde = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
